# Runs the tests on every pull request and on main. They install synthetic
# packages the tests build themselves, with npm and with pnpm, and use no
# registry and no secret.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        run: npm install -g pnpm@10.32.1 --ignore-scripts
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "10.32.1"
      - name: Test
        run: npm test
